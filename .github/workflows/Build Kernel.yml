name: OP13 LineageOS 24.0 Kernel Build (KSU/SUSFS + Droidspaces + Net)

run-name: ${{ inputs.ksu_type }} OP13 LOS 24.0 Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ksu_type }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android15'
  KERNEL_VERSION: '6.6'
  LOS_BRANCH: 'lineage-24.0'

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU variant'
        required: true
        type: choice
        default: 'BakaSU'
        options:
          - 'BakaSU'
          - 'SukiSU Ultra'
          - 'KernelSU'
          - 'KernelSU Next'
      SUSFS:
        description: 'Enable SuSFS (Enhances hide environment)'
        required: true
        type: boolean
        default: true
      droidspaces_enable:
        description: 'Enable Droidspaces (SYSVIPC + PID_NS + POSIX_MQUEUE for proot-distro)'
        required: true
        type: boolean
        default: true
      wireguard:
        description: 'Enable WireGuard VPN support'
        required: true
        type: boolean
        default: true
      netfilter_full:
        description: 'Full Netfilter (conntrack, NAT, hashlimit)'
        required: true
        type: boolean
        default: false
      ip_set_enable:
        description: 'Enable IP_SET (ipset support)'
        required: true
        type: boolean
        default: false
      github_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # ─────────────────────────────────────────────
      # 1. 环境准备
      # ─────────────────────────────────────────────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            dos2unix pahole cmake zip unzip python3 git curl

      # LOS 24.0 推荐 Clang r563880c，与原 workflow 一致
      - name: Download Clang r563880c
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          curl -sL https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r563880c.tar.gz -o clang.tar.gz
          tar -xzf clang.tar.gz
          echo "$HOME/toolchains/bin" >> $GITHUB_PATH

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 2G

      # ─────────────────────────────────────────────
      # 2. 内核源码：LineageOS lineage-24.0
      # ─────────────────────────────────────────────
      - name: Clone LineageOS kernel
        run: |
          mkdir -p kernel_workspace
          git clone --depth=1 -b lineage-24.0 \
            https://github.com/LineageOS/android_kernel_oneplus_sm8750.git \
            kernel_workspace/common

      # 定位 LOS 实际使用的 vendor defconfig
      # lineage-23.0 中已确认存在 vendor/oplus/kera_le.config
      # lineage-24.0 若路径变化，此处会自动探测
      - name: Locate LOS defconfig
        working-directory: kernel_workspace
        run: |
          CANDIDATES=$(find common/arch/arm64/configs/vendor -name '*.config' \
            | grep -iE 'kera|oplus|sm8750|oneplus' | head -20)
          echo "候选 defconfig:"
          echo "$CANDIDATES"

          if [ -f "common/arch/arm64/configs/vendor/kera_le.config" ]; then
            DEFCONFIG="./common/arch/arm64/configs/vendor/kera_le.config"
          else
            DEFCONFIG=$(echo "$CANDIDATES" | head -1)
          fi

          if [ -z "$DEFCONFIG" ] || [ ! -f "$DEFCONFIG" ]; then
            echo "未找到可用的 LOS defconfig，请手动指定"
            exit 1
          fi

          echo "使用 DEFCONFIG: $DEFCONFIG"
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 3. Root / SUSFS Setup（完全按原文件模式）
      # ─────────────────────────────────────────────
      - name: Setup KernelSU & SUSFS patches
        working-directory: kernel_workspace
        run: |
          # KernelSU 克隆（按 ksu_type 选择仓库）
          case "${{ inputs.ksu_type }}" in
            BakaSU)
              git clone --depth=1 https://github.com/bakamc/KernelSU.git KernelSU
              ;;
            "SukiSU Ultra")
              git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
              ;;
            KernelSU)
              git clone --depth=1 https://github.com/tiann/KernelSU.git KernelSU
              ;;
            "KernelSU Next")
              git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
              ;;
          esac

          # SUSFS 仓库（原文件模式：simonpunk/susfs4ksu gki-android15-6.6）
          git clone --depth=1 -b gki-android15-6.6 \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

          # 拷贝内核侧补丁与文件（原文件模式）
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./common/
          cp susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

      # ─────────────────────────────────────────────
      # 4. Apply SUSFS（完全按原文件模式）
      # ─────────────────────────────────────────────
      - name: Apply SUSFS (BakaSU / SukiSU Ultra)
        if: inputs.SUSFS && (inputs.ksu_type == 'BakaSU' || inputs.ksu_type == 'SukiSU Ultra')
        working-directory: kernel_workspace/common
        run: |
          # 原 workflow 的 pre-patch fixups（task_mmu.c guard）
          # 若 LOS 树上已存在 guard，sed 不会重复添加
          sed -i '/^#ifdef CONFIG_KSU_SUSFS_SUS_MAP/,/^#endif/d' fs/proc/task_mmu.c || true
          sed -i '/^static inline bool is_inode_sus_map/,/^}/d' fs/proc/task_mmu.c || true
          sed -i '/^#ifdef CONFIG_KSU_SUSFS_SUS_MAP/i\
          #ifdef CONFIG_KSU_SUSFS_SUS_MAP\
          static inline bool is_inode_sus_map(struct inode *inode) { return false; }\
          #endif' fs/proc/task_mmu.c || true

          patch -p1 --forward < 50_add_susfs_in_gki-android15-6.6.patch || true

          # 硬验证：SUSFS_IS_INODE_SUS_MAP 必须存在
          if ! grep -q "SUSFS_IS_INODE_SUS_MAP" fs/proc/task_mmu.c; then
            echo "SUSFS guard 缺失，补丁未正确应用"
            find . -name '*.rej' -o -name '*.orig' | head
            exit 1
          fi
          echo "SUSFS patch applied successfully."

      - name: Apply SUSFS (KernelSU)
        if: inputs.SUSFS && inputs.ksu_type == 'KernelSU'
        working-directory: kernel_workspace
        run: |
          cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch
          cd ../common
          patch -p1 --forward < 50_add_susfs_in_gki-android15-6.6.patch || true
          if ! grep -q "SUSFS_IS_INODE_SUS_MAP" fs/proc/task_mmu.c; then
            echo "SUSFS guard 缺失"
            find . -name '*.rej' -o -name '*.orig' | head
            exit 1
          fi

      - name: Apply SUSFS (KernelSU Next)
        if: inputs.SUSFS && inputs.ksu_type == 'KernelSU Next'
        working-directory: kernel_workspace
        run: |
          # KernelSU Next 使用 wildkernels 的 fix 补丁（原文件模式）
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git wildkernels_patches
          cp wildkernels_patches/next/susfs_fix_patches/v2.2.0/* ./KernelSU-Next/ || true

          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./common/
          cd common
          patch -p1 --forward < 50_add_susfs_in_gki-android15-6.6.patch || true
          if ! grep -q "SUSFS_IS_INODE_SUS_MAP" fs/proc/task_mmu.c; then
            echo "SUSFS guard 缺失"
            find . -name '*.rej' -o -name '*.orig' | head
            exit 1
          fi

      # ─────────────────────────────────────────────
      # 5. Configure Kernel
      #    Root/SUSFS 完全按原模式 echo >> DEFCONFIG
      #    Droidspaces / 网络功能走 fragment
      # ─────────────────────────────────────────────
      - name: Configure Kernel Options
        working-directory: kernel_workspace
        run: |
          DEFCONFIG="${{ env.DEFCONFIG }}"

          # ---- Root / SUSFS（原文件模式，完全保留）----
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"

          if [ "${{ inputs.ksu_type }}" = "KernelSU" ] || [ "${{ inputs.ksu_type }}" = "KernelSU Next" ]; then
            echo "CONFIG_KSU_KPROBES_HOOK=y" >> "$DEFCONFIG" || true
          fi

          if [ "${{ inputs.SUSFS }}" = "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$DEFCONFIG"
          fi

          # ---- Droidspaces fragment ----
          if [ "${{ inputs.droidspaces_enable }}" = "true" ]; then
            cat > droidspaces.fragment <<'EOF'
CONFIG_SYSVIPC=y
CONFIG_POSIX_MQUEUE=y
CONFIG_NAMESPACES=y
CONFIG_PID_NS=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_NET_NS=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_SCHED=y
CONFIG_FAIR_GROUP_SCHED=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_NET_PRIO=y
CONFIG_MEMCG=y
CONFIG_MEMCG_SWAP=y
CONFIG_CFS_BANDWIDTH=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_DEVTMPFS=y
CONFIG_OVERLAY_FS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
CONFIG_FW_LOADER=y
CONFIG_FW_LOADER_USER_HELPER=y
CONFIG_FW_LOADER_COMPRESS=y
CONFIG_VETH=y
CONFIG_BRIDGE=y
CONFIG_NETFILTER=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NF_CONNTRACK=y
CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_FILTER=y
CONFIG_NF_NAT=y
CONFIG_NF_TABLES=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
EOF
            ./common/scripts/kconfig/merge_config.sh -m "$DEFCONFIG" droidspaces.fragment
          fi

          # ---- 网络功能 fragment ----
          NET_FRAGMENT=""
          [ "${{ inputs.wireguard }}" = "true" ] && NET_FRAGMENT="${NET_FRAGMENT}CONFIG_WIREGUARD=y
"
          if [ "${{ inputs.netfilter_full }}" = "true" ]; then
            NET_FRAGMENT="${NET_FRAGMENT}CONFIG_NETFILTER_ADVANCED=y
CONFIG_NF_TABLES=y
CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
CONFIG_IP6_NF_IPTABLES=y
CONFIG_NF_NAT_IPV6=y
"
          fi
          if [ "${{ inputs.ip_set_enable }}" = "true" ]; then
            NET_FRAGMENT="${NET_FRAGMENT}CONFIG_IP_SET=y
CONFIG_IP_SET_MAX=256
"
          fi

          if [ -n "$NET_FRAGMENT" ]; then
            printf "%b" "$NET_FRAGMENT" > net.fragment
            ./common/scripts/kconfig/merge_config.sh -m "$DEFCONFIG" net.fragment
          fi

      # ─────────────────────────────────────────────
      # 6. 编译（使用 LOS 内核自己的构建入口）
      #    优先 build/build.sh，回退到 make
      # ─────────────────────────────────────────────
      - name: Build Kernel
        working-directory: kernel_workspace/common
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/bin:$PATH"

          if [ -f "build/build.sh" ]; then
            echo "使用 LOS build/build.sh"
            ./build/build.sh \
              -j$(nproc) \
              --defconfig="${{ env.DEFCONFIG }}" 2>&1 | tee build.log
          else
            echo "回退到 make 构建"
            make O=out "${{ env.DEFCONFIG }}" 2>&1 | tee build.log
            make O=out -j$(nproc) 2>&1 | tee -a build.log
          fi

      # ─────────────────────────────────────────────
      # 7. 验证与产物
      # ─────────────────────────────────────────────
      - name: Verify build & configs
        working-directory: kernel_workspace
        run: |
          echo "=== 检查 reject/orig ==="
          find common -name '*.rej' -o -name '*.orig' | head -20

          echo "=== 检查最终 .config 中的 Root/SUSFS CONFIG ==="
          if [ -f common/out/.config ]; then
            grep -E 'CONFIG_KSU=y|CONFIG_KSU_SUSFS=y|CONFIG_KSU_SUSFS_SUS_PATH=y' common/out/.config || true
          fi

          echo "=== LOS 内核 git 变更摘要 ==="
          cd common
          git status --short | head -50
          git diff --stat | tail -20

      - name: Package kernel
        working-directory: kernel_workspace/common
        run: |
          # 按 LOS 产物路径打包，若不存在则查找 Image
          ARTIFACT_DIR="out/arch/arm64/boot"
          [ -d "$ARTIFACT_DIR" ] || ARTIFACT_DIR=$(dirname "$(find out -name Image | head -1)")
          zip -j "$GITHUB_WORKSPACE/kernel-los24-${{
            inputs.ksu_type }}.zip" \
            "$ARTIFACT_DIR/Image" 2>/dev/null || \
            zip -j "$GITHUB_WORKSPACE/kernel-los24-${{ inputs.ksu_type }}.zip" \
            "$(find out -name Image | head -1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-los24-${{ inputs.ksu_type }}
          path: kernel-los24-${{ inputs.ksu_type }}.zip

      - name: Create GitHub Release
        if: inputs.github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: los24-${{ inputs.ksu_type }}-${{ github.run_number }}
          files: kernel-los24-${{ inputs.ksu_type }}.zip